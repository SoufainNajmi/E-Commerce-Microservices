services:
  auth-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in .env}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?Set AUTH_DB_PASSWORD in .env}
    volumes:
      - auth-db-data:/var/lib/postgresql/data
      - ./databases/auth-db/init.sh:/docker-entrypoint-initdb.d/01-auth.sh:ro
    networks: [microservices-network]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d auth_db"]
      interval: 5s
      timeout: 3s
      retries: 20
  auth-service:
    build: ./services/auth-service
    environment:
      APP_NAME: NAJMI Auth Service
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${AUTH_APP_KEY:?Set AUTH_APP_KEY in .env}
      APP_DEBUG: "false"
      APP_URL: http://localhost:${AUTH_PORT:-8080}
      DB_CONNECTION: pgsql
      DB_HOST: auth-db
      DB_PORT: 5432
      DB_DATABASE: auth_db
      DB_USERNAME: auth_app
      DB_PASSWORD: ${AUTH_DB_PASSWORD:?Set AUTH_DB_PASSWORD in .env}
      CACHE_STORE: file
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      LOG_CHANNEL: stderr
      AUTH_TOKEN_TTL: ${AUTH_TOKEN_TTL:-60}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      auth-db: {condition: service_healthy}
    networks: [microservices-network]
  nginx:
    image: nginx:stable-alpine
    ports: ["127.0.0.1:${AUTH_PORT:-8080}:80"]
    volumes:
      - ./infrastructure/nginx/auth.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [auth-service]
    networks: [microservices-network]
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
networks:
  microservices-network:
    name: microservices-network
volumes:
  auth-db-data:
